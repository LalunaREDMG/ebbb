<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="white" stroke-width="0.5" opacity="0.3"/>
    </pattern>
    
    <pattern id="circles" width="50" height="50" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="2" fill="white" opacity="0.2"/>
      <circle cx="40" cy="40" r="1.5" fill="white" opacity="0.15"/>
      <circle cx="25" cy="25" r="3" fill="white" opacity="0.1"/>
    </pattern>
    
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="white" opacity="0.1"/>
      <circle cx="18" cy="18" r="1" fill="white" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background patterns -->
  <rect width="100" height="100" fill="url(#grid)"/>
  <rect width="100" height="100" fill="url(#circles)"/>
  <rect width="100" height="100" fill="url(#dots)"/>
  
  <!-- Abstract shapes -->
  <path d="M0 50 Q 25 0, 50 50 T 100 50" stroke="white" fill="none" stroke-width="0.5" opacity="0.2"/>
  <path d="M0 60 Q 25 10, 50 60 T 100 60" stroke="white" fill="none" stroke-width="0.5" opacity="0.15"/>
  <path d="M0 70 Q 25 20, 50 70 T 100 70" stroke="white" fill="none" stroke-width="0.5" opacity="0.1"/>
</svg> 